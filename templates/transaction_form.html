{% extends "base.html" %}
{% block title %}Add transaction · FinSight{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">NEW RECORD</p><h1>Add transaction</h1><p class="muted">Enter synthetic or anonymized demo information only.</p></div></section>
<form class="panel form-grid" method="post">
  <label>Date<input type="date" name="transaction_date" required></label>
  <label>Account ID<input name="account_id" value="DEMO-1001" required></label>
  <label>Type<select name="transaction_type"><option>Expense</option><option>Income</option></select></label>
  <label>Category<select name="category">{% for c in ['Salary','Groceries','Rent','Utilities','Transport','Shopping','Healthcare','Education','Travel','Other'] %}<option>{{ c }}</option>{% endfor %}</select></label>
  <label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" required></label>
  <label>Merchant<input name="merchant" placeholder="Demo merchant"></label>
  <label>Payment method<select name="payment_method">{% for p in ['UPI','Debit Card','Credit Card','Bank Transfer','Cash','Other'] %}<option>{{ p }}</option>{% endfor %}</select></label>
  <label>Status<select name="status"><option>Completed</option><option>Pending</option><option>Failed</option></select></label>
  <label class="full">Description<input name="description" placeholder="Short transaction description"></label>
  <div class="form-actions full"><button class="button primary" type="submit">Save transaction</button><a class="button secondary" href="{{ url_for('transactions') }}">Cancel</a></div>
</form>
{% endblock %}
